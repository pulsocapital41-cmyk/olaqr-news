name: Setup Cloudflare Domain & DNS

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Zone, DNS and Worker Domains
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, urllib.error

          API_KEY = os.environ["CLOUDFLARE_API_KEY"].strip()
          EMAIL = os.environ["CLOUDFLARE_EMAIL"].strip()
          ACCOUNT_ID = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          DOMAIN = "olaqrnews.com.mx"
          WORKER = "olaqr-news"
          GMAIL = "olaqr78@gmail.com"

          def cf_req(method, path, body=None):
              url = f"https://api.cloudflare.com/client/v4{path}"
              headers = {
                  "X-Auth-Email": EMAIL,
                  "X-Auth-Key": API_KEY,
                  "Content-Type": "application/json",
              }
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  err_text = e.read().decode("utf-8", errors="replace")
                  print(f"HTTP {e.code} on {method} {path}: {err_text}")
                  return json.loads(err_text)

          print("=== 1. Buscando/Creando zona en Cloudflare ===")
          res = cf_req("GET", f"/zones?name={DOMAIN}")
          zones = res.get("result") or []
          if zones:
              zone = zones[0]
              print(f"Zona encontrada: {zone['id']} ({zone['name']})")
          else:
              create_res = cf_req("POST", "/zones", {
                  "name": DOMAIN,
                  "account": {"id": ACCOUNT_ID},
                  "type": "full"
              })
              if not create_res.get("success"):
                  raise SystemExit(f"Error creando zona: {create_res}")
              zone = create_res["result"]
              print(f"Zona creada: {zone['id']} ({zone['name']})")

          zone_id = zone["id"]
          nameservers = zone.get("name_servers", [])
          print(f"NAMESERVERS: {nameservers}")

          print("=== 2. Configurando DNS de Correo (ImprovMX + SPF + DMARC) ===")
          dns_res = cf_req("GET", f"/zones/{zone_id}/dns_records?per_page=100")
          records = dns_res.get("result") or []
          for r in records:
              rtype = r.get("type")
              rname = r.get("name")
              rcontent = r.get("content", "")
              if rtype == "MX" or (rtype == "TXT" and ("v=spf1" in rcontent or rname.startswith("_dmarc"))):
                  print(f"Eliminando registro antiguo: {rtype} {rname} -> {rcontent}")
                  cf_req("DELETE", f"/zones/{zone_id}/dns_records/{r['id']}")

          desired_dns = [
              {"type": "MX", "name": "@", "content": "mx1.improvmx.com", "priority": 10, "ttl": 1},
              {"type": "MX", "name": "@", "content": "mx2.improvmx.com", "priority": 20, "ttl": 1},
              {"type": "TXT", "name": "@", "content": "v=spf1 include:spf.improvmx.com ~all", "ttl": 1},
              {"type": "TXT", "name": "_dmarc", "content": f"v=DMARC1; p=none; sp=none; rua=mailto:{GMAIL}", "ttl": 1},
          ]

          for rec in desired_dns:
              r = cf_req("POST", f"/zones/{zone_id}/dns_records", rec)
              print(f"Creado {rec['type']} {rec['name']}: success={r.get('success')}")

          print("=== 3. Conectando dominios personalizados al Worker ===")
          for host in [DOMAIN, f"www.{DOMAIN}"]:
              w_res = cf_req("PUT", f"/accounts/{ACCOUNT_ID}/workers/domains", {
                  "hostname": host,
                  "service": WORKER,
                  "zone_id": zone_id,
                  "environment": "production"
              })
              print(f"Worker domain {host}: success={w_res.get('success')}")

          print("=== RESUMEN FINAL ===")
          print(f"ZONE_ID={zone_id}")
          print(f"NS1={nameservers[0] if len(nameservers)>0 else ''}")
          print(f"NS2={nameservers[1] if len(nameservers)>1 else ''}")
          EOF
